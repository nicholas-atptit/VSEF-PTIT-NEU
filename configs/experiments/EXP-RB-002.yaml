experiment:
  id: EXP-RB-002
  name: Universe Robustness
  description: Test forecasting results across alternative ticker universes and sector groups.
  phase: 6
  owner: Project team / maintainer
  created_at: "2026-05-09"
  seed: 42

data:
  provider: vnstock_data
  frequency: daily
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  schema:
    - date
    - ticker
    - open
    - high
    - low
    - close
    - volume

universe_groups:
  large_cap_core:
    - FPT
    - HPG
    - MWG
  banking:
    - ACB
  diversified_core:
    - FPT
    - ACB
    - HPG
    - MWG
    - DGC
  industrial_materials:
    - HPG
    - DGC

target:
  column: close
  task_type: price_forecast
  horizons:
    - 1
    - 3
    - 5

models:
  enabled: true
  include:
    - sarimax
    - ets
    - xgboost
    - lightgbm

baselines:
  enabled: true
  include:
    - persistence
    - zero_return
    - moving_average_rule

features:
  enabled: true
  feature_sets:
    - default_ohlcv
    - technical_basic

evaluation:
  method: fixed_chronological_split
  train_start: "2023-01-01"
  train_end: "2024-06-30"
  test_start: "2024-07-01"
  test_end: "2024-12-31"
  metrics:
    - mae
    - rmse
    - directional_accuracy
    - prediction_count
    - missing_prediction_rate

outputs:
  root_dir: outputs/experiments
  save_metrics: true
  save_predictions: true
  save_manifest: true
  save_summary: true

runtime:
  fail_fast: false
  max_workers: 1
  log_level: INFO
