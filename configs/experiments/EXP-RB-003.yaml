experiment:
  id: EXP-RB-003
  name: Cost and Slippage Sensitivity
  description: Test diagnostic basket outcomes under alternative transaction-cost and slippage assumptions.
  phase: 6
  owner: Project team / maintainer
  created_at: "2026-05-09"
  seed: 42

source_artifacts:
  risk_aware_report_dir: reports/risk_aware
  topn_basket_metrics: reports/risk_aware/topn_basket_metrics.csv
  candidate_comparison: reports/risk_aware/candidate_comparison.csv
  basket_period_returns: outputs/experiments/EXP-RK-002/artifacts/basket_period_returns.csv

cost_scenarios:
  - id: cost_0bps
    transaction_cost_bps: 0
    slippage_bps: 0
  - id: cost_5bps
    transaction_cost_bps: 5
    slippage_bps: 5
  - id: cost_10bps
    transaction_cost_bps: 10
    slippage_bps: 10
  - id: cost_20bps
    transaction_cost_bps: 20
    slippage_bps: 20
  - id: cost_50bps
    transaction_cost_bps: 50
    slippage_bps: 50

basket:
  top_n:
    - 1
    - 3
    - 5
  horizons:
    - 1
    - 3
    - 5
  weighting: equal_weight_diagnostic
  diagnostic_only: true

evaluation:
  method: cost_slippage_sensitivity
  metrics:
    - average_realized_return_after_cost
    - median_realized_return_after_cost
    - hit_ratio_after_cost
    - return_volatility_proxy_after_cost
    - max_drawdown_after_cost
    - var_95_after_cost
    - cvar_95_after_cost
    - worst_period_return_after_cost

outputs:
  root_dir: outputs/experiments
  save_metrics: true
  save_manifest: true
  save_summary: true

runtime:
  fail_fast: false
  log_level: INFO
