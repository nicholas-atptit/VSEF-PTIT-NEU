experiment:
  id: EXP-RK-001
  name: Risk-aware Candidate Policy Comparison
  description: Compare top-N diagnostic candidates generated by forecast-only and risk-aware ranking policies.
  phase: 3
  owner: Project team / maintainer
  created_at: "2026-05-09"
  seed: 42

data:
  provider: vnstock_data
  frequency: daily
  universe:
    - FPT
    - ACB
    - HPG
    - MWG
    - DGC
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  schema:
    - date
    - ticker
    - open
    - high
    - low
    - close
    - volume

source_experiments:
  forecasting_core:
    - EXP-FC-001
    - EXP-FC-003
  source_output_root: outputs/experiments
  fallback_behavior: run_if_missing_or_report

candidate_policies:
  forecast_only: configs/policies/candidate_policy_forecast_only.yaml
  risk_aware: configs/policies/candidate_policy_risk_aware.yaml

candidate_generation:
  top_n: 5
  horizons:
    - 1
    - 3
    - 5
  rebalance_frequency: daily
  minimum_candidate_rows: 1
  allow_partial_policy_output: true

risk:
  enabled: true
  methods:
    - realized_volatility
    - max_drawdown
    - var_95
    - cvar_95
  lookback_window: 20
  confidence_level: 0.95

evaluation:
  method: candidate_policy_comparison
  metrics:
    - average_candidate_score
    - average_expected_return_proxy
    - average_realized_volatility
    - average_max_drawdown
    - average_var_95
    - average_cvar_95
    - candidate_overlap_rate
    - missing_risk_metric_rate

outputs:
  root_dir: outputs/experiments
  save_candidates: true
  save_metrics: true
  save_manifest: true
  save_charts: false
  save_summary: true

runtime:
  fail_fast: false
  max_workers: 1
  log_level: INFO
