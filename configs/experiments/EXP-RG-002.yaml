experiment:
  id: EXP-RG-002
  name: Risk-aware Value By Regime
  description: Evaluate forecast-only vs risk-aware diagnostic candidate outcomes by regime.
  phase: 4
  owner: Project team / maintainer
  created_at: "2026-05-09"
  seed: 42

source_artifacts:
  risk_aware_report_dir: reports/risk_aware
  candidate_comparison: reports/risk_aware/candidate_comparison.csv
  basket_metrics: reports/risk_aware/topn_basket_metrics.csv
  regime_labels: reports/regime_analysis/regime_labels.csv
  regime_policy: configs/policies/regime_policy.yaml

regime_analysis:
  enabled: true
  regime_columns:
    - trend_regime
    - volatility_regime
    - combined_regime
  focus_regimes:
    - high_vol
    - bear
    - bear_high_vol
    - sideway_high_vol
  minimum_observations_per_regime: 5
  small_sample_policy: flag_not_drop

metrics:
  include:
    - average_realized_return
    - hit_ratio
    - return_volatility_proxy
    - max_drawdown
    - var_95
    - cvar_95
    - worst_period_return
    - candidate_count
    - missing_outcome_rate

outputs:
  root_dir: outputs/experiments
  save_metrics: true
  save_manifest: true
  save_summary: true
  report_dir: reports/regime_analysis

runtime:
  fail_fast: false
  log_level: INFO
