experiment:
  id: EXP-FA-007
  name: Tree Feature Importance - XGBoost and LightGBM
  description: Run governed tree feature-importance extraction for XGBoost and LightGBM.
  phase: 5
  owner: Project team / maintainer
  created_at: "2026-05-09"
  seed: 42

data:
  provider: vnstock_data
  frequency: daily
  universe: [FPT, ACB, HPG]
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  schema: [date, ticker, open, high, low, close, volume]

target:
  column: close
  task_type: price_forecast
  horizons: [1, 3, 5]

features:
  enabled: true
  registry: configs/features/feature_group_registry.yaml
  feature_sets: [default_ohlcv, technical_basic, technical_phase5]
  ablation:
    enabled: false
    reference_experiment: EXP-FA-000
    removed_group: null
    removed_patterns: []
    notes: Full feature set used for tree feature importance.

models:
  enabled: true
  include: [xgboost, lightgbm]
  params:
    xgboost: {task: regression, n_estimators: 30, max_depth: 3, learning_rate: 0.05}
    lightgbm: {task: regression, n_estimators: 30, max_depth: 3, num_leaves: 15, learning_rate: 0.05}

baselines:
  enabled: false
  include: [persistence]
  params: {}

evaluation:
  method: fixed_chronological_split
  train_start: "2023-01-01"
  train_end: "2024-06-30"
  test_start: "2024-07-01"
  test_end: "2024-12-31"
  metrics: [mae, rmse, mape, directional_accuracy, prediction_count, missing_prediction_rate]

interpretability:
  tree_feature_importance:
    enabled: true
    importance_type: feature_importances_
    output: reports/feature_analysis/tree_feature_importance.csv

regime_context:
  enabled: true
  regime_labels: reports/regime_analysis/regime_labels.csv
  regime_policy: configs/policies/regime_policy.yaml

outputs:
  root_dir: outputs/experiments
  save_predictions: true
  save_metrics: true
  save_manifest: true
  save_charts: false
  save_summary: true

runtime:
  fail_fast: false
  max_workers: 1
  log_level: INFO
