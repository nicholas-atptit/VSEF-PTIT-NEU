version: "3.9"

services:
  # ============================================================
  # TimescaleDB — Time-series database (PostgreSQL extension)
  # ============================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: algo_timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: algo_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # ChromaDB — Vector database for news & reports embeddings
  # ============================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: algo_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
  # ============================================================
  # Zookeeper & Kafka — Event Messaging Broker
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: algo_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: algo_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: algo_kafka_ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  # ============================================================
  # Ollama — Local LLM Server (for Qwen/Llama/Gemma)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: algo_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # Python App — FastAPI Prediction Server + Scheduler
  # ============================================================
  api:
    build: .
    container_name: algo_api
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      - timescaledb
      - chromadb
      - kafka
      - ollama
    environment:
      TIMESCALE_URL: "postgresql+asyncpg://postgres:postgres@timescaledb:5432/algo_trading"
      TIMESCALE_SYNC_URL: "postgresql+psycopg2://postgres:postgres@timescaledb:5432/algo_trading"
      CHROMA_HOST: chromadb
      KAFKA_BROKER_URL: kafka:29092
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: >
      python -m uvicorn src.api.main:app
      --host 0.0.0.0 --port 8888
      --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Kafka Consumer Supervisor — All 5 consumers auto-restart
  # ============================================================
  consumers:
    build: .
    container_name: algo_consumers
    restart: unless-stopped
    depends_on:
      - kafka
      - timescaledb
      - chromadb
      - ollama
    environment:
      TIMESCALE_URL: "postgresql+asyncpg://postgres:postgres@timescaledb:5432/algo_trading"
      TIMESCALE_SYNC_URL: "postgresql+psycopg2://postgres:postgres@timescaledb:5432/algo_trading"
      CHROMA_HOST: chromadb
      KAFKA_BROKER_URL: kafka:29092
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: python scripts/run_consumers.py

  # ============================================================
  # Redis — Fast In-Memory Broker for Live Streams
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: algo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  timescale_data:
    driver: local
  chroma_data:
    driver: local
  ollama_models:
    driver: local
  redis_data:
    driver: local
